<title>Habit tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef3f0;--surface:#fff;--ink:#16302b;--muted:#6b8079;--line:#d3dfd9;--accent:#1f7a5c;--accent-ink:#fff;--today:#c8e6da}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b18;--surface:#17282a;--ink:#e4f1ec;--muted:#8aa39b;--line:#2a4140;--accent:#4fd1a1;--accent-ink:#0f1b18;--today:#1f3a36}}
:root[data-theme="dark"]{--bg:#0f1b18;--surface:#17282a;--ink:#e4f1ec;--muted:#8aa39b;--line:#2a4140;--accent:#4fd1a1;--accent-ink:#0f1b18;--today:#1f3a36}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
h1{font-size:2rem;font-weight:800;margin:0;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:.9rem;margin:2px 0 0}
.ring{width:64px;height:64px;position:relative;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:.95rem}
.nav{display:flex;align-items:center;justify-content:space-between;margin:8px 0 12px}
.nav button{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;cursor:pointer}
.nav span{font-weight:600}
.grid{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) repeat(7,36px);align-items:center;gap:4px;padding:10px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.head{color:var(--muted);font-size:.8rem;text-align:center}
.head .t{color:var(--accent);font-weight:800}
.name{min-width:0;display:flex;flex-direction:column}
.name strong{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.name small{color:var(--muted)}
.name button{all:unset;cursor:pointer;color:var(--muted);font-size:.8rem;text-decoration:underline;width:max-content;padding:8px 0 4px}
.cell{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--accent-ink);font-size:16px;padding:0;transition:background .15s,border-color .15s,transform .1s}
.cell:active{transform:scale(.9)}
.cell.today{border-color:var(--accent);background:var(--today)}
.cell.on{background:var(--accent);border-color:var(--accent)}
.cell.future{opacity:.35;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chart{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 12px 10px}
.chart h2{font-size:1rem;margin:0 0 8px 4px;font-weight:600}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:inherit;font-size:11px}
.chart .v{fill:var(--ink);font-weight:600}
.rewards{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.rewards h2{font-size:1rem;margin:0;font-weight:600}
.lvl{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:8px}
.lvl strong{font-size:1.4rem;font-weight:800}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.pts{color:var(--muted);font-size:.85rem;margin:6px 0 0}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:14px}
.badge{border:1px solid var(--accent);background:var(--today);border-radius:12px;padding:10px;font-size:.8rem;color:var(--muted)}
.badge b{display:block;color:var(--ink);font-size:.9rem}
.badge.off{border-color:var(--line);background:transparent;opacity:.55}
.toast{position:fixed;left:50%;bottom:0;transform:translate(-50%,0);margin-bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--accent-ink);padding:12px 18px;border-radius:14px;font-weight:600;max-width:90%;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast[hidden]{display:none}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
form,.add{display:flex;gap:8px;margin-top:16px}
input{flex:1;min-width:0;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.add button{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:0 18px;font:inherit;font-weight:600;cursor:pointer}
@media (max-width:420px){.row{grid-template-columns:minmax(0,1fr) repeat(7,32px);padding:10px 8px}.cell{width:32px;height:32px}}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (orientation:landscape) and (min-width:700px){
  main{max-width:1100px}
  .layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}
  .colB>.chart:first-child{margin-top:0}
  .row{grid-template-columns:minmax(0,1fr) repeat(7,40px)}
  .cell{width:40px;height:40px}
}
@media (orientation:landscape) and (max-height:500px){
  main{padding-top:10px;padding-bottom:24px}
  h1{font-size:1.5rem}
  header{margin-bottom:6px}
  .nav{margin:4px 0 8px}
  .row{padding:6px 12px}
  .chart svg{max-height:200px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <header>
    <div><h1>Habit tracker</h1><p class="sub" id="sub"></p></div>
    <div class="ring" aria-label="Week progress">
      <svg width="64" height="64" viewBox="0 0 64 64"><circle cx="32" cy="32" r="27" fill="none" stroke="var(--line)" stroke-width="6"/><circle id="arc" cx="32" cy="32" r="27" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round" stroke-dasharray="169.6" stroke-dashoffset="169.6"/></svg>
      <b id="pct">0%</b>
    </div>
  </header>
  <div class="layout"><div class="colA">
  <div class="nav">
    <button id="prev" aria-label="Previous week">Previous</button>
    <span id="range"></span>
    <button id="next" aria-label="Next week">Next</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="add">
    <input id="new" type="text" placeholder="New habit, e.g. Drink water" maxlength="40" aria-label="New habit name">
    <button id="addBtn">Add habit</button>
  </div>
  </div><div class="colB">
  <section class="chart" aria-label="Daily completion chart"><h2>Completion by day</h2><div id="chart"></div></section>
  <section class="chart" aria-label="30 day trend graph"><h2>30-day trend</h2><div id="trend"></div></section>
  <section class="rewards" aria-label="Rewards">
    <div class="lvl"><div><h2>Level</h2><strong id="lvlName"></strong></div><span id="lvlNum"></span></div>
    <div class="bar" role="progressbar" aria-label="Progress to next level"><i id="lvlBar" style="width:0"></i></div>
    <p class="pts" id="pts"></p>
    <div class="badges" id="badges"></div>
  </section>
  <div class="toast" id="toast" role="status" hidden></div>
  </div></div>
</main>
<script>
(function(){
  var KEY='habit-tracker-v1', state={habits:[],log:{}}, offset=0;
  try{var s=localStorage.getItem(KEY);if(s)state=JSON.parse(s)}catch(e){}
  if(!state.habits||!state.habits.length&&!localStorage_ok()){}
  if(!state.habits||!Array.isArray(state.habits))state={habits:[],log:{}};
  if(!state.habits.length&&!state.seeded){state.habits=[{id:'h1',name:'Drink water'},{id:'h2',name:'Walk 20 minutes'},{id:'h3',name:'Read 10 pages'}];state.seeded=true}
  function localStorage_ok(){return true}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
  function key(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  function weekStart(off){var d=new Date();d.setHours(0,0,0,0);var w=(d.getDay()+6)%7;d.setDate(d.getDate()-w+off*7);return d}
  function days(){var s=weekStart(offset),a=[];for(var i=0;i<7;i++){var d=new Date(s);d.setDate(s.getDate()+i);a.push(d)}return a}
  function isOn(id,k){return !!(state.log[k]&&state.log[k][id])}
  function streak(id){var d=new Date();d.setHours(0,0,0,0);if(!isOn(id,key(d)))d.setDate(d.getDate()-1);var n=0;while(isOn(id,key(d))){n++;d.setDate(d.getDate()-1)}return n}
  function toggle(id,k){state.log[k]=state.log[k]||{};if(state.log[k][id])delete state.log[k][id];else state.log[k][id]=1;
    state.badges=state.badges||{};var s=stats(),won=[];
    BADGES.forEach(function(b){if(b.f(s)&&!state.badges[b.id]){state.badges[b.id]=1;won.push(b.t)}});
    save();render();
    if(won.length)toast('Badge earned: '+won.join(', '));
  }
  var tt;function toast(m){var t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(function(){t.hidden=true},3000)}
  var BADGES=[
    {id:'first',t:'First step',d:'Check in once',f:function(s){return s.total>=1}},
    {id:'s3',t:'Warming up',d:'3 day streak',f:function(s){return s.best>=3}},
    {id:'s7',t:'One week strong',d:'7 day streak (+50 pts)',f:function(s){return s.best>=7}},
    {id:'s30',t:'Unstoppable',d:'30 day streak (+200 pts)',f:function(s){return s.best>=30}},
    {id:'perfect',t:'Clean sweep',d:'Finish every habit in a day (+20 pts)',f:function(s){return s.perfect>=1}},
    {id:'c50',t:'Fifty check-ins',d:'50 total check-ins',f:function(s){return s.total>=50}}
  ];
  function stats(){
    var total=0,best=0,bonus=0,perfect=0;
    state.habits.forEach(function(h){
      var ks=Object.keys(state.log).filter(function(k){return state.log[k][h.id]}).sort(),run=0,prev=null,b=0;
      total+=ks.length;
      ks.forEach(function(k){var p=k.split('-'),d=new Date(+p[0],p[1]-1,+p[2]);
        if(prev&&Math.round((d-prev)/864e5)===1)run++;else run=1;prev=d;if(run>b)b=run});
      if(b>best)best=b;if(b>=7)bonus+=50;if(b>=30)bonus+=200;
    });
    Object.keys(state.log).forEach(function(k){if(state.habits.length&&state.habits.every(function(h){return state.log[k][h.id]}))perfect++});
    return {total:total,best:best,perfect:perfect,points:total*10+bonus+perfect*20};
  }
  function drawRewards(){
    var s=stats(),lvl=Math.floor(s.points/100)+1,names=['Seed','Sprout','Sapling','Tree','Grove'];
    document.getElementById('lvlName').textContent=names[Math.min(lvl-1,4)];
    document.getElementById('lvlNum').textContent='Level '+lvl;
    document.getElementById('lvlBar').style.width=(s.points%100)+'%';
    document.getElementById('pts').textContent=s.points+' points. '+(100-s.points%100)+' to level '+(lvl+1)+'. Each check-in is worth 10.';
    var box=document.getElementById('badges');box.innerHTML='';
    BADGES.forEach(function(b){
      var on=(state.badges&&state.badges[b.id])||b.f(s),e=el('div','badge'+(on?'':' off'));
      e.appendChild(el('b','',b.t));e.appendChild(document.createTextNode(b.d));box.appendChild(e);
    });
  }
  function drawTrend(){
    var n=state.habits.length,W=320,H=160,L=34,R=10,T=12,B=130,pts=[],labels=[],t=new Date();t.setHours(0,0,0,0);
    for(var i=29;i>=0;i--){
      var d=new Date(t);d.setDate(t.getDate()-i);var k=key(d),c=0;
      state.habits.forEach(function(h){if(isOn(h.id,k))c++});
      var x=L+(29-i)*(W-L-R)/29,y=B-(n?c/n:0)*(B-T);
      pts.push([x,y]);if(i===29||i===0)labels.push([x,d.toLocaleDateString(undefined,{month:'short',day:'numeric'})]);
    }
    var line=pts.map(function(p,i){return(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)}).join(' ');
    var out='';
    [0,50,100].forEach(function(v){var y=B-(v/100)*(B-T);
      out+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+v+'%</text>'});
    out+='<path d="'+line+' L'+pts[29][0].toFixed(1)+' '+B+' L'+L+' '+B+' Z" fill="var(--accent)" opacity=".15"/>';
    out+='<path d="'+line+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
    pts.forEach(function(p,i){if(i===29)out+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4" fill="var(--accent)"/>'});
    labels.forEach(function(l,i){out+='<text x="'+l[0]+'" y="'+(B+18)+'" text-anchor="'+(i?'end':'start')+'">'+l[1]+'</text>'});
    document.getElementById('trend').innerHTML='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Share of habits completed each day over the last 30 days">'+out+'</svg>';
  }
  function drawChart(ds,todayK){
    var n=state.habits.length,W=320,H=160,base=130,top=24,bw=26,gap=(W-7*bw)/8,out='';
    ds.forEach(function(d,i){
      var k=key(d),c=0;state.habits.forEach(function(h){if(isOn(h.id,k))c++});
      var hh=n?(c/n)*(base-top):0,x=gap+i*(bw+gap);
      out+='<rect x="'+x+'" y="'+top+'" width="'+bw+'" height="'+(base-top)+'" rx="6" fill="var(--line)" opacity=".5"/>';
      if(hh>0)out+='<rect x="'+x+'" y="'+(base-hh)+'" width="'+bw+'" height="'+hh+'" rx="6" fill="var(--accent)"/>';
      out+='<text class="v" x="'+(x+bw/2)+'" y="'+(top-8)+'" text-anchor="middle">'+(k>todayK?'':c+'/'+n)+'</text>';
      out+='<text x="'+(x+bw/2)+'" y="'+(base+18)+'" text-anchor="middle"'+(k===todayK?' class="v"':'')+'>'+d.toLocaleDateString(undefined,{weekday:'short'})+'</text>';
    });
    document.getElementById('chart').innerHTML='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Habits completed per day this week">'+out+'</svg>';
  }

  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
  function render(){
    var ds=days(),todayK=key(new Date()),grid=document.getElementById('grid');
    grid.innerHTML='';
    var fmt=function(d){return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})};
    document.getElementById('range').textContent=offset===0?'This week':fmt(ds[0])+' to '+fmt(ds[6]);
    document.getElementById('next').disabled=offset>=0;
    document.getElementById('next').style.opacity=offset>=0?.4:1;
    var head=el('div','row head');head.appendChild(el('div'));
    ds.forEach(function(d){var c=el('div',key(d)===todayK?'t':'',d.toLocaleDateString(undefined,{weekday:'narrow'}));c.title=d.toDateString();head.appendChild(c)});
    grid.appendChild(head);
    if(!state.habits.length){grid.appendChild(el('div','empty','No habits yet. Add one below to start your first streak.'))}
    var done=0,total=0;
    state.habits.forEach(function(h){
      var r=el('div','row'),n=el('div','name');
      n.appendChild(el('strong','',h.name));
      var st=streak(h.id);n.appendChild(el('small','',st?st+' day streak':'No streak yet'));
      var del=el('button','','Remove');del.onclick=function(){if(del.dataset.arm){state.habits=state.habits.filter(function(x){return x.id!==h.id});save();render()}else{del.dataset.arm=1;del.textContent='Tap again to remove';setTimeout(function(){if(del.isConnected){delete del.dataset.arm;del.textContent='Remove'}},3000)}};
      n.appendChild(del);r.appendChild(n);
      ds.forEach(function(d){
        var k=key(d),fut=k>todayK,on=isOn(h.id,k);
        var b=el('button','cell'+(on?' on':'')+(k===todayK?' today':'')+(fut?' future':''),on?'\u2713':'');
        b.setAttribute('aria-label',h.name+', '+d.toDateString()+(on?', done':', not done'));
        b.setAttribute('aria-pressed',on);
        if(!fut){total++;if(on)done++}
        if(k===todayK){b.onclick=function(){toggle(h.id,k)}}
        else{b.disabled=true;b.style.cursor='default';b.title=fut?'Not yet':'Only today can be checked in'}
        r.appendChild(b);
      });
      grid.appendChild(r);
    });
    drawChart(ds,todayK);drawTrend();drawRewards();
    var p=total?Math.round(done/total*100):0;
    document.getElementById('pct').textContent=p+'%';
    document.getElementById('arc').style.strokeDashoffset=169.6*(1-p/100);
    document.getElementById('sub').textContent=done+' of '+total+' check-ins so far this week';
  }
  function add(){var i=document.getElementById('new'),v=i.value.trim();if(!v){i.focus();return}
    state.habits.push({id:'h'+Date.now(),name:v});i.value='';save();render()}
  document.getElementById('addBtn').onclick=add;
  document.getElementById('new').addEventListener('keydown',function(e){if(e.key==='Enter')add()});
  document.getElementById('prev').onclick=function(){offset--;render()};
  document.getElementById('next').onclick=function(){if(offset<0){offset++;render()}};
  save();render();
})();
</script>
</body>
</html>
